<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c0d"><title>CALI TIMER</title><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CALI TIMER"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><style>
:root{--lime:#d6ff45;--cyan:#36e6df;--bg:#080c0d;--panel:#141b1d;--line:#2b3536;--text:#f5faf8;--muted:#9aa9a9}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 10%,#caff291b,transparent 45%),radial-gradient(ellipse at 90% 85%,#29ffb60d,transparent 45%)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:550px;margin:auto;min-height:100dvh;padding:calc(22px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom));position:relative}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:31px;line-height:.95;font-weight:1000;letter-spacing:-1.5px}.brand em{font-style:normal;color:var(--lime)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-top:9px}.muted{color:var(--muted)}h1{font-size:28px;line-height:1.1;margin:8px 0 22px}h2{font-size:18px;margin:22px 0 12px}h3{margin:0 0 10px;font-size:16px}.btn{border:1px solid var(--line);background:#1a2324;color:var(--text);border-radius:15px;min-height:48px;padding:12px 16px;font-weight:750}.btn.primary{background:var(--lime);color:#101510;border-color:var(--lime);box-shadow:0 0 20px #d6ff4525}.btn.cyan{background:var(--cyan);color:#061716;border-color:var(--cyan)}.btn.ghost{background:transparent}.btn.full{width:100%}.stack{display:grid;gap:11px}.hero{margin:36px 0 25px}.hero .brand{font-size:57px;line-height:.88}.hero .eyebrow{margin:18px 0 34px}.home-actions .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}.home-actions .btn:first-child{min-height:65px;font-size:18px}.panel{background:linear-gradient(145deg,#172021,#101617);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px}.panel.active{border-color:var(--lime)}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row.wrap{flex-wrap:wrap}.label{font-size:12px;color:var(--muted);margin-bottom:6px}input,select,textarea{background:#0b1112;color:var(--text);border:1px solid #344142;border-radius:11px;padding:11px;width:100%;min-width:0}textarea{min-height:120px}input[type=number]{text-align:center}.field{margin:10px 0}.small{font-size:12px}.pill{border-radius:100px;background:#202b29;padding:5px 9px;font-size:11px;color:var(--lime);font-weight:800}.mini{border:1px solid #334141;background:#1c2829;color:var(--text);border-radius:9px;padding:8px 10px;min-height:35px}.setrow{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:6px;align-items:center;margin:7px 0}.setrow input{padding:9px 4px}.sethead{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:6px;text-align:center;font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1112f7;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));z-index:5}.bottom button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;gap:4px;place-items:center}.bottom button.on{color:var(--lime)}.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.timer-screen{text-align:center;min-height:70dvh;display:flex;flex-direction:column;justify-content:center}.ring{width:min(80vw,340px);aspect-ratio:1;margin:25px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime) var(--pct),#263032 0);padding:12px;box-shadow:0 0 35px #d6ff4512}.ring.rest{background:conic-gradient(var(--cyan) var(--pct),#263032 0);box-shadow:0 0 35px #36e6df20}.ring-inner{background:#090f10;border-radius:50%;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.clock{font-size:clamp(56px,16vw,85px);font-weight:900;letter-spacing:-4px;font-variant-numeric:tabular-nums}.mode{font-weight:850;color:var(--lime);letter-spacing:2px}.rest .mode{color:var(--cyan)}.timer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none!important}.line{height:1px;background:var(--line);margin:15px 0}.spacer{height:10px}.ring.ready{background:conic-gradient(#f4f6f2 var(--pct),#263032 0)}.ready .mode{color:#fff}.notes-list{margin-top:10px}.note{border-left:3px solid var(--lime);padding:9px 12px;margin:9px 0;background:#0c1414;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.note-date{color:var(--muted);font-size:11px;margin-bottom:5px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle input{width:23px;height:23px;accent-color:var(--lime)}
</style></head><body><main class="app"><div id="screen"></div></main><nav class="bottom" id="nav"></nav><script>
const KEY='cali-timer-programs-v1',HKEY='cali-timer-history-v1';
const icon=(name)=>({home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',programs:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M19 5l-3 3M8 16l-3 3"/>'}[name]);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k)=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return []}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let programs=load(KEY),history=load(HKEY),page='home',draft=null,session=null,tick=null;
const AUDIO_KEY='cali-timer-audio-v1',VOLUME_KEY='cali-timer-volume-v1';let audioOn=localStorage.getItem(AUDIO_KEY)!=='off',audioCtx=null,audioVolume=Math.min(5,Math.max(1,Number(localStorage.getItem(VOLUME_KEY))||5));
// Fuller multi-oscillator sounds with a compressor to avoid clipping on phone speakers.
const volumeGains=[0,.16,.32,.55,.78,1];
function audioUnlock(){if(!audioOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function playVoice(freq,when,duration,level,type='square',sweep=1){
 const ctx=audioCtx,osc=ctx.createOscillator(),env=ctx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,when);
 if(sweep!==1)osc.frequency.exponentialRampToValueAtTime(Math.max(70,freq*sweep),when+duration*.85);
 env.gain.setValueAtTime(.0001,when);env.gain.linearRampToValueAtTime(level,when+.012);
 env.gain.setValueAtTime(level,when+Math.max(.015,duration-.045));
 env.gain.exponentialRampToValueAtTime(.0001,when+duration);
 osc.connect(env);env.connect(audioMaster);osc.start(when);osc.stop(when+duration+.015);
}
let audioMaster=null;
function tone(kind){if(!audioOn)return;try{
 audioUnlock();if(!audioCtx)return;
 if(!audioMaster){const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-9;comp.knee.value=3;comp.ratio.value=10;comp.attack.value=.002;comp.release.value=.16;audioMaster=audioCtx.createGain();audioMaster.gain.value=3.0;audioMaster.connect(comp);comp.connect(audioCtx.destination)}
 const t=audioCtx.currentTime+.008,level=volumeGains[audioVolume];
 if(kind==='tick'){
   // Percussive mid-frequency tick: audible on small phone speakers.
   playVoice(920,t,.25,level*.9,'square',.83);
   playVoice(590,t,.25,level*.75,'sawtooth',.94);
 }else if(kind==='start'){
   playVoice(770,t,.6,level*.9,'square',1.1);
   playVoice(510,t,.6,level*.8,'sawtooth',1.06);
 }else{
   playVoice(660,t,.65,level*.9,'square',.68);
   playVoice(430,t,.65,level*.8,'sawtooth',.8);
 }
}catch{}}
function testCountdown(){audioUnlock();if(!audioOn)return;for(let i=0;i<5;i++)setTimeout(()=>tone('tick'),i*850);setTimeout(()=>tone('start'),5*850)}
function setAudioVolume(v){audioVolume=Math.min(5,Math.max(1,Number(v)||5));localStorage.setItem(VOLUME_KEY,String(audioVolume));audioUnlock();tone('start');render()}
function toggleAudio(){audioOn=!audioOn;localStorage.setItem(AUDIO_KEY,audioOn?'on':'off');if(audioOn)audioUnlock();render()}
function moveProgram(id,d){let i=programs.findIndex(p=>p.id===id),j=i+d;if(i<0||j<0||j>=programs.length)return;[programs[i],programs[j]]=[programs[j],programs[i]];save(KEY,programs);render()}
function programNotes(id){let p=programs.find(x=>x.id===id);if(!p)return;page='notes';nav();$('#screen').innerHTML=`<div class="top"><button class="btn ghost" onclick="go('programs')">← Back</button><strong>WORKOUT NOTES</strong></div><h1>${esc(p.name)}</h1><p class="muted">Notes from completed sessions</p><div class="notes-list">${history.filter(h=>h.programId===id&&h.notes).reverse().map(h=>`<div class="note"><div class="note-date">${new Date(h.date).toLocaleString()}</div>${esc(h.notes)}</div>`).join('')||'<div class="panel muted">No notes yet. Finish a session to add your first note.</div>'}</div>`}
const fresh=()=>({id:crypto.randomUUID(),name:'New Program',description:'',exercises:[{name:'Front Lever Attempts',mode:'timer',sets:[{work:10,rest:90},{work:10,rest:120},{work:10,rest:0}] }]});
function nav(){ $('#nav').classList.toggle('hide',page==='timer');$('#nav').innerHTML=['home','programs','history','settings'].map(n=>`<button class="${page===n?'on':''}" onclick="go('${n}')"><svg viewBox="0 0 24 24">${icon(n)}</svg>${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}
function go(p){cancelAnimationFrame(tick);tick=null;page=p;render();window.scrollTo(0,0)}
function render(){nav();const s=$('#screen');if(page==='home')s.innerHTML=`<div class="hero"><div class="brand">CALI<br><em>TIMER</em></div><div class="eyebrow">PLAN. TRAIN. PROGRESS.</div></div><div class="stack home-actions"><button class="btn primary" onclick="go('programs')">START WORKOUT <span>→</span></button><button class="btn" onclick="go('programs')">MY PROGRAMS <span>→</span></button><button class="btn" onclick="editNew()">CREATE PROGRAM <span>＋</span></button><button class="btn" onclick="quick()">QUICK TIMER <span>→</span></button></div><h2>RECENT PROGRAMS</h2>${programs.slice(-2).reverse().map(p=>card(p)).join('')||'<p class="muted">Create your first workout to get started.</p>'}`;
else if(page==='programs')s.innerHTML=`<div class="top"><h1>My Programs</h1><button class="btn primary" onclick="editNew()">＋ New</button></div>${programs.length?programs.map(card).join(''):'<div class="panel muted">No saved programs yet. Create one to begin.</div>'}<p class="muted small">Use ↑ ↓ on each card to arrange your programs.</p><div class="actions"><button class="btn" onclick="importText()">PASTE PROGRAM</button><button class="btn" onclick="importFile()">IMPORT BACKUP</button></div>`;
else if(page==='builder')builder();else if(page==='timer')timerView();else if(page==='history')s.innerHTML=`<h1>Workout History</h1>${history.slice().reverse().map(h=>`<div class="panel"><strong>${esc(h.name)}</strong><div class="muted small">${new Date(h.date).toLocaleString()} · ${Math.round(h.seconds/60)} min</div>${h.notes?`<div class="note">${esc(h.notes)}</div>`:''}</div>`).join('')||'<p class="muted">Completed sessions will appear here.</p>'}`;
else if(page==='settings')s.innerHTML=`<h1>Settings & Backup</h1><div class="panel toggle"><div><strong>Workout sounds</strong><div class="muted small">Five countdown ticks and transition beeps</div></div><input type="checkbox" aria-label="Workout sounds" ${audioOn?'checked':''} onchange="toggleAudio()"></div><div class="panel"><div class="row"><div><strong>Sound volume</strong><div class="muted small">1 = boosted · 5 = maximum</div></div><select aria-label="Sound volume" style="width:110px" onchange="setAudioVolume(this.value)">${[1,2,3,4,5].map(v=>`<option value="${v}" ${audioVolume===v?'selected':''}>${v} / 5</option>`).join('')}</select></div><div class="actions" style="margin-top:12px"><button class="mini" onclick="testCountdown()">TEST COUNTDOWN</button><button class="mini" onclick="audioUnlock();tone('start')">TEST TRANSITION</button></div></div><div class="panel"><h3>Your data stays on this device</h3><p class="muted">Export a backup to keep your programs safe or transfer them to another phone. Clearing browser storage can delete saved programs.</p><button class="btn primary full" onclick="exportFile()">EXPORT BACKUP</button><div class="spacer"></div><button class="btn full" onclick="importFile()">IMPORT BACKUP</button></div><div class="panel small muted">Use your iPhone media volume and keep the screen awake. Browser audio may be limited when the phone is locked. Sound is boosted and compressed for audibility, but cannot exceed the phone speaker’s hardware limit. If still quiet, check iPhone media volume and silent-mode behavior.</div>`}
function card(p){return `<div class="panel"><div class="row"><div><strong>${esc(p.name)}</strong><div class="muted small">${p.exercises.length} exercises · ${p.exercises.reduce((a,e)=>a+e.sets.length,0)} sets · ~${Math.ceil(total(p)/60)} min</div></div><button class="btn primary" onclick="start('${p.id}')">START</button></div><div class="actions" style="margin-top:12px"><button class="mini" onclick="edit('${p.id}')">EDIT</button><button class="mini" onclick="duplicate('${p.id}')">DUPLICATE</button><button class="mini" onclick="programNotes('${p.id}')">NOTES</button><button class="mini" onclick="moveProgram('${p.id}',-1)">↑</button><button class="mini" onclick="moveProgram('${p.id}',1)">↓</button><button class="mini" onclick="removeProgram('${p.id}')">DELETE</button></div></div>`}
function total(p){return p.exercises.reduce((sum,e,i)=>sum+e.sets.reduce((n,set,j)=>n+(e.mode==='manual'?0:Number(set.work))+(j===e.sets.length-1&&i===p.exercises.length-1?0:Number(set.rest)),0),0)}
function editNew(){draft=fresh();go('builder')}function edit(id){draft=structuredClone(programs.find(p=>p.id===id));go('builder')}function duplicate(id){draft=structuredClone(programs.find(p=>p.id===id));draft.id=crypto.randomUUID();draft.name+=' (Copy)';go('builder')}
function removeProgram(id){if(confirm('Delete this program?')){programs=programs.filter(p=>p.id!==id);save(KEY,programs);render()}}
function builder(){const s=$('#screen');s.innerHTML=`<div class="top"><button class="btn ghost" onclick="go('programs')">← Back</button><strong>Workout Builder</strong><button class="btn primary" onclick="saveDraft()">SAVE</button></div><div class="panel"><div class="label">PROGRAM NAME</div><input id="pname" value="${esc(draft.name)}" oninput="draft.name=this.value"><div class="label" style="margin-top:12px">DESCRIPTION (OPTIONAL)</div><input value="${esc(draft.description)}" oninput="draft.description=this.value"><p class="muted small">${draft.exercises.length} exercises · ~${Math.ceil(total(draft)/60)} min estimated (manual sets excluded)</p></div><div class="row"><h2>Exercises</h2><button class="btn primary" onclick="addExercise()">＋ Add</button></div>${draft.exercises.map((e,i)=>`<div class="panel"><div class="row"><strong>${String(i+1).padStart(2,'0')} · EXERCISE</strong><div><button class="mini" onclick="moveExercise(${i},-1)">↑</button> <button class="mini" onclick="moveExercise(${i},1)">↓</button> <button class="mini" onclick="deleteExercise(${i})">×</button></div></div><div class="field"><input aria-label="Exercise name" value="${esc(e.name)}" oninput="draft.exercises[${i}].name=this.value"></div><div class="field"><div class="label">SET MODE</div><select onchange="draft.exercises[${i}].mode=this.value;render()"><option value="timer" ${e.mode==='timer'?'selected':''}>Timed countdown</option><option value="manual" ${e.mode==='manual'?'selected':''}>Manual — press DONE</option></select></div><div class="sethead"><span>SET</span><span>${e.mode==='manual'?'TARGET (sec, optional)':'WORK (sec)'}</span><span>REST AFTER (sec)</span><span></span></div>${e.sets.map((set,j)=>`<div class="setrow"><strong>${j+1}</strong><input type="number" min="0" inputmode="numeric" value="${set.work}" onchange="setValue(${i},${j},'work',this.value)"><input type="number" min="0" inputmode="numeric" value="${set.rest}"  onchange="setValue(${i},${j},'rest',this.value)"><button class="mini" onclick="deleteSet(${i},${j})">×</button></div>`).join('')}<button class="mini" onclick="addSet(${i})">＋ ADD SET</button><p class="muted small">Rest after the final set leads directly to the next exercise. The very last rest of the workout is skipped.</p></div>`).join('')}<button class="btn full" onclick="addExercise()">＋ ADD EXERCISE</button><div class="spacer"></div><button class="btn primary full" onclick="saveDraft()">SAVE PROGRAM</button>`}
function setValue(i,j,k,v){draft.exercises[i].sets[j][k]=Math.max(0,+v||0)}
function addExercise(){draft.exercises.push({name:'New Exercise',mode:'timer',sets:[{work:20,rest:90},{work:20,rest:0}] });render()}
function deleteExercise(i){if(draft.exercises.length===1)return alert('Keep at least one exercise.');draft.exercises.splice(i,1);render()}
function moveExercise(i,d){let j=i+d;if(j<0||j>=draft.exercises.length)return;[draft.exercises[i],draft.exercises[j]]=[draft.exercises[j],draft.exercises[i]];render()}
function addSet(i){let a=draft.exercises[i].sets;a.push({work:a.at(-1)?.work||20,rest:0});render()}
function deleteSet(i,j){let a=draft.exercises[i].sets;if(a.length<2)return alert('Keep at least one set.');a.splice(j,1);render()}
function saveDraft(){draft.name=draft.name.trim()||'Untitled Workout';if(draft.exercises.some(e=>!e.name.trim()||!e.sets.length))return alert('Name each exercise and include at least one set.');let idx=programs.findIndex(p=>p.id===draft.id);if(idx<0)programs.push(structuredClone(draft));else programs[idx]=structuredClone(draft);save(KEY,programs);go('programs')}
function plan(p){let seq=[];p.exercises.forEach((e,i)=>{e.sets.forEach((set,j)=>{seq.push({type:'work',name:e.name,set:j+1,sets:e.sets.length,seconds:e.mode==='manual'?0:Math.max(0,+set.work),manual:e.mode==='manual'});const hasNext=j<e.sets.length-1||i<p.exercises.length-1;if(hasNext&&+set.rest>0)seq.push({type:'rest',name:e.name,seconds:+set.rest,next:j<e.sets.length-1?`${e.name} · Set ${j+2}`:p.exercises[i+1].name})})});return seq}
function start(id){let p=programs.find(x=>x.id===id);launch(p)}
function quick(){let sec=prompt('Countdown duration in seconds (e.g. 90):','60');if(sec===null)return;sec=Number(sec);if(!Number.isFinite(sec)||sec<1||sec>86400)return alert('Enter 1–86400 seconds.');launch({name:'Quick Timer',exercises:[{name:'Countdown',mode:'timer',sets:[{work:sec,rest:0}]}]})}
function launch(p){cancelAnimationFrame(tick);audioUnlock();session={name:p.name,programId:programs.some(x=>x.id===p.id)?p.id:null,seq:[{type:'ready',name:'Get ready',seconds:10},...plan(p)],index:0,remaining:0,deadline:0,paused:true,started:Date.now(),finished:false,lastTick:null};page='timer';activate(0);render();resume()}
function activate(i){session.index=i;let item=session.seq[i];if(!item){complete();return}session.remaining=item.seconds*1000;session.paused=true;session.deadline=0;session.lastTick=null}
function resume(){if(!session||session.finished)return;audioUnlock();if(session.paused){session.paused=false;session.deadline=Date.now()+session.remaining;tick=requestAnimationFrame(frame)}else{session.remaining=Math.max(0,session.deadline-Date.now());session.paused=true;cancelAnimationFrame(tick)}timerView()}
function frame(){update();if(session&&!session.paused&&!session.finished)tick=requestAnimationFrame(frame)}
function update(){if(!session||session.paused)return;session.remaining=Math.max(0,session.deadline-Date.now());let item=session.seq[session.index],secs=Math.ceil(session.remaining/1000);if(!item.manual&&secs>0&&secs<=5&&secs!==session.lastTick){session.lastTick=secs;tone('tick')}if(session.remaining===0&&!item.manual){nextPhase();return}timerDigits()}
function nextPhase(){cancelAnimationFrame(tick);if(!session||session.finished)return;let previous=session.seq[session.index],next=session.seq[session.index+1];if(previous.type==='work')tone('end');else if(next&&next.type==='work')tone('start');activate(session.index+1);if(!session.finished){session.paused=false;session.deadline=Date.now()+session.remaining;tick=requestAnimationFrame(frame);timerView();if(session.remaining===0&&!session.seq[session.index].manual)update()}}
function complete(){cancelAnimationFrame(tick);session.finished=true;const record={name:session.name,programId:session.programId,date:new Date().toISOString(),seconds:Math.round((Date.now()-session.started)/1000),notes:'',id:crypto.randomUUID()};history.push(record);session.recordId=record.id;save(HKEY,history);page='finished';nav();$('#screen').innerHTML=`<div class="timer-screen"><h1>SESSION COMPLETE</h1><p class="muted">${esc(session.name)}</p><div class="panel" style="text-align:left"><div class="label">SESSION NOTES (OPTIONAL)</div><textarea id="sessionNotes" oninput="autosaveSessionNotes()" placeholder="What improved? Best holds? Balance observations?" maxlength="5000"></textarea><p class="muted small">Notes save automatically as you type, and are included in backup exports.</p></div><button class="btn primary full" onclick="saveSessionNotes()">SAVE & FINISH</button></div>`}
function autosaveSessionNotes(){if(!session||!session.recordId)return;const record=history.find(h=>h.id===session.recordId);if(record){record.notes=$('#sessionNotes')?.value||'';save(HKEY,history)}}
function saveSessionNotes(){autosaveSessionNotes();session=null;go('home')}
const fmt=ms=>{let n=Math.ceil(Math.max(0,ms)/1000);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
function timerView(){if(!session||session.finished)return;const item=session.seq[session.index],rest=item.type==='rest',ready=item.type==='ready';$('#screen').innerHTML=`<div class="top"><button class="btn ghost" onclick="quit()">← Exit</button><strong>${esc(session.name)}</strong><span>${session.index+1}/${session.seq.length}</span></div><div class="timer-screen"><h1>${ready?'GET READY':rest?'RECOVERY':esc(item.name)}</h1><div class="muted">${ready?'FIRST SET STARTS SOON':rest?`Next: ${esc(item.next)}`:`SET ${item.set} / ${item.sets}`}</div><div class="ring ${rest?'rest':ready?'ready':''}" id="ring" style="--pct:100%"><div class="ring-inner"><div class="clock" id="digits">00:00</div><div class="mode">${ready?'PREPARE':rest?'REST':item.manual?'MANUAL SET':'WORK'}</div></div></div><p class="muted" id="next">${session.seq[session.index+1]?`NEXT: ${session.seq[session.index+1].type==='rest'?'REST':'WORK'} · ${fmt(session.seq[session.index+1].seconds*1000)}`:'FINAL SET'}</p><div class="timer-buttons"><button class="btn" onclick="resume()" id="pause">${session.paused?'RESUME':'PAUSE'}</button><button class="btn ${rest?'cyan':'primary'}" onclick="nextPhase()">${ready?'START NOW':rest?'SKIP REST':item.manual?'DONE SET':'DONE EARLY'}</button></div></div>`;timerDigits()}
function timerDigits(){if(!session||session.finished)return;let item=session.seq[session.index],el=$('#digits');if(!el)return;el.textContent=item.manual?'DONE?':fmt(session.remaining);let max=item.seconds*1000;$('#ring').style.setProperty('--pct',`${max?Math.min(100,Math.max(0,session.remaining/max*100)):100}%`);$('#pause').textContent=session.paused?'RESUME':'PAUSE'}
function quit(){if(confirm('End this workout?')){cancelAnimationFrame(tick);session=null;go('home')}}
function exportFile(){const blob=new Blob([JSON.stringify({version:3,programs,history},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cali-timer-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{if(!inp.files?.[0])return;let obj=JSON.parse(await inp.files[0].text());if(!Array.isArray(obj.programs)||!obj.programs.every(p=>typeof p.name==='string'&&Array.isArray(p.exercises)&&p.exercises.every(e=>typeof e.name==='string'&&Array.isArray(e.sets))))throw Error('Invalid backup');if(obj.history!==undefined&&!Array.isArray(obj.history))throw Error('Invalid workout history');if(!confirm('Import programs AND workout history/notes from this backup? Existing records will be kept.'))return;let ids=new Set(programs.map(p=>p.id));let addedPrograms=0,addedSessions=0;for(let p of obj.programs){if(!ids.has(p.id)){programs.push(p);ids.add(p.id);addedPrograms++}}let seen=new Set(history.map(h=>h.id||[h.programId,h.date,h.name].join('|')));for(let h of obj.history||[]){if(!h||typeof h.name!=='string'||typeof h.date!=='string')continue;let key=h.id||[h.programId,h.date,h.name].join('|');if(!seen.has(key)){history.push(h);seen.add(key);addedSessions++}}save(KEY,programs);save(HKEY,history);render();alert(`Imported ${addedPrograms} programs and ${addedSessions} sessions (including notes).`)}catch(e){alert('Could not import: '+e.message)}};inp.click()}
function importText(){page='import';nav();$('#screen').innerHTML=`<div class="top"><button class="btn ghost" onclick="go('programs')">← Back</button><h2>Import Workout</h2></div><div class="panel"><p class="muted">Paste a workout below. Use one exercise per line, with work/rest times in seconds.</p><div class="label">EXAMPLE</div><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:var(--lime)">Workout: Front Lever Day
Front Lever | 10s/90s, 10s/120s, 10s/180s
Planche | 20s/180s, 20s/180s, 20s</pre><textarea id="importText" placeholder="Paste your workout here"></textarea><button class="btn primary full" style="margin-top:12px" onclick="parseImport()">REVIEW WORKOUT</button></div>`}
function parseImport(){let raw=$('#importText').value;if(!raw.trim())return alert('Paste a workout first.');let lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean),name='Imported Workout';if(/^workout\s*:/i.test(lines[0]))name=lines.shift().split(':').slice(1).join(':').trim();let exercises=[];for(let line of lines){let parts=line.split('|');if(parts.length<2)return alert('Use: Exercise | 10s/90s, 10s/120s, 10s');let sets=parts[1].split(',').map(t=>{let m=t.trim().match(/^(\d+)\s*s?(?:\s*\/\s*(\d+)\s*s?)?$/i);return m?{work:+m[1],rest:+(m[2]||0)}:null});if(sets.some(x=>!x))return alert('Check the set format for '+parts[0]);exercises.push({name:parts[0].trim(),mode:'timer',sets})}if(!exercises.length)return alert('No exercises found.');draft={id:crypto.randomUUID(),name,description:'',exercises};go('builder')}

render();
